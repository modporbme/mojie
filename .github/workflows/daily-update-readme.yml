name: Daily update README dates

on:
  schedule:
    # 00:05 Asia/Shanghai ≈ 16:05 UTC previous day
    - cron: "5 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readmes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update dates and random blank lines
        run: python scripts/update_readmes.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_EN.md README_RU.md README_FA.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bump README update date to $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi
